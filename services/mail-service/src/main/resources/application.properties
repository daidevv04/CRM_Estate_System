spring.application.name=mail-service
# PORT: Render (va PaaS noi chung) cap cong dong qua bien PORT; local dat SERVER_PORT.
server.port=${SERVER_PORT:${PORT:8084}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
# Dang ky dia chi ma gateway goi duoc. Tat ca service chay tren cung mot may nen
# dung 127.0.0.1; dat CONSUL_DISCOVERY_IP khi moi service nam o host khac.
spring.cloud.consul.discovery.ip-address=${CONSUL_DISCOVERY_IP:127.0.0.1}
spring.cloud.consul.discovery.prefer-ip-address=true
# Render khong co Consul: dat CONSUL_ENABLED=false -> tat ca consul discovery lan
# health indicator 'consul'/'discoveryComposite', neu khong /actuator/health se DOWN
# va Render coi deploy la loi. Local de nguyen true.
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.discovery.enabled=${CONSUL_ENABLED:true}

# Doc config tap trung tu config-service. 'optional:' nghia la config-service khong chay
# thi service van start bang gia tri trong file nay (khong fail-fast).
# CONFIG_SERVER_URL / CONFIG_SERVER_USERNAME / CONFIG_SERVER_PASSWORD lay tu .env.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# Gui mail qua Resend API (HTTPS), khong dung SMTP: Render free chan outbound
# 25/465/587 con HTTPS thi khong. Key va nguoi gui lay tu bien moi truong, khong co
# default: thieu cau hinh thi service phai fail ngay khi start.
# MAIL_FROM phai la dia chi thuoc domain da verify tren Resend (hoac onboarding@resend.dev de test).
app.mail.resend.api-key=${RESEND_API_KEY}
app.mail.from=${MAIL_FROM}

# Internal token do user-service ky bang JWT_SECRET dung chung.
app.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
