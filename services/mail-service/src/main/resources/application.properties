spring.application.name=mail-service
server.port=${SERVER_PORT:8084}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true

# SMTP lay hoan toan tu bien moi truong. Khong co default cho host/username/
# password/from: thieu cau hinh thi service phai fail ngay khi start, khong duoc
# chay o che do "khong gui duoc mail" roi bao loi mu mu.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM}

# Internal token do user-service ky bang JWT_SECRET dung chung.
app.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
