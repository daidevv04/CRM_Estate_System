spring.application.name=crm-service
server.port=${SERVER_PORT:${PORT:8083}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.ip-address=${CONSUL_DISCOVERY_IP:127.0.0.1}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.discovery.enabled=${CONSUL_ENABLED:true}

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

spring.datasource.url=jdbc:postgresql://${CRM_DB_HOST}:${CRM_DB_PORT:5432}/${CRM_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${CRM_DB_USERNAME}
spring.datasource.password=${CRM_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
