spring.application.name=customer-service
server.port=${SERVER_PORT:${PORT:8082}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true
# Tat Consul khi chay tren PaaS khong co Consul (Render): CONSUL_ENABLED=false.
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.consul.discovery.enabled=${CONSUL_ENABLED:true}
management.health.consul.enabled=${CONSUL_ENABLED:true}

spring.datasource.url=jdbc:postgresql://${CUSTOMER_DB_HOST}:${CUSTOMER_DB_PORT:5432}/${CUSTOMER_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${CUSTOMER_DB_USERNAME}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Schema duoc provision bang tay tren Supabase SQL Editor; db/migration/V1__init.sql
# chi la ban ghi lai schema dang chay, khong duoc Flyway tu ap dung.
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET}

# Email care gui that qua mail-service (SMTP nam o service do, khong o day).
app.mail.base-url=${MAIL_SERVICE_URL:http://localhost:8084}
