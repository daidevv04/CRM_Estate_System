spring.application.name=api-gateway-service
server.port=${SERVER_PORT:8080}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true

# Gateway khong co DB.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Route tuong minh thay vi discovery locator: de doc, de debug, khong doan ten service.
# 'lb://<ten>' de loadbalancer hoi Consul lay IP that, nen khong hardcode host/port.
# StripPrefix=1 bo '/api' truoc khi chuyen tiep, service phia sau giu nguyen duong dan cu.
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/customers/**,/api/appointments/**,/api/email-templates/**,/api/email-cares/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

app.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info,gateway

logging.level.org.springframework.cloud.gateway=INFO
