spring.application.name=api-gateway-service
# Render/Heroku-style PaaS cap bien PORT; docker-compose cap SERVER_PORT.
server.port=${SERVER_PORT:${PORT:8080}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true
# Tat Consul o moi truong khong co Consul (vi du Render) bang CONSUL_ENABLED=false.
# Khi tat thi route phai dung URL tinh qua USER_SERVICE_URI/CUSTOMER_SERVICE_URI/CRM_SERVICE_URI.
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.consul.discovery.enabled=${CONSUL_ENABLED:true}
# Khong de consul health indicator keo actuator/health xuong DOWN khi khong co Consul,
# vi Render dung /actuator/health lam health check va se coi la deploy loi.
management.health.consul.enabled=${CONSUL_ENABLED:true}

# Gateway khong co driver JDBC tren classpath nen DataSourceAutoConfiguration tu
# dong bi skip; khong can exclude.

# Route tuong minh thay vi discovery locator: de doc, de debug, khong doan ten service.
# 'lb://<ten>' de loadbalancer hoi Consul lay IP that (mac dinh khi chay docker compose).
# Tren PaaS khong co Consul thi dat USER_SERVICE_URI=https://<host> de ghi de.
# StripPrefix=1 bo '/api' truoc khi chuyen tiep, service phia sau giu nguyen duong dan cu.
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URI:lb://user-service}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=${CUSTOMER_SERVICE_URI:lb://customer-service}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/customers/**,/api/appointments/**,/api/email-templates/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# Tuy chinh: /api/products, /api/leads, /api/deals, /api/projects deu la cua
# crm-service; /api/customers van thuoc customer-service.
spring.cloud.gateway.server.webflux.routes[2].id=crm-service
spring.cloud.gateway.server.webflux.routes[2].uri=${CRM_SERVICE_URI:lb://crm-service}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/projects/**,/api/products/**,/api/leads/**,/api/deals/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

app.jwt.secret=${JWT_SECRET}

# Gateway hardening. In-memory limiter phu hop mot replica; dung RedisRateLimiter
# truoc khi scale gateway (xem AuthRateLimitFilter).
app.gateway.auth-rate-limit.max-requests=${GATEWAY_AUTH_RATE_LIMIT_MAX_REQUESTS:20}
app.gateway.auth-rate-limit.window=${GATEWAY_AUTH_RATE_LIMIT_WINDOW:1m}
app.gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Chan body qua lon tai cua ngo. Service hien chi nhan JSON; file hop dong la URL,
# khong upload binary qua gateway.
spring.codec.max-in-memory-size=${GATEWAY_MAX_REQUEST_BODY:1MB}
server.netty.max-initial-line-length=${GATEWAY_MAX_INITIAL_LINE_LENGTH:4KB}
server.netty.max-header-size=${GATEWAY_MAX_HEADER_SIZE:16KB}

management.endpoints.web.exposure.include=health,info

logging.level.org.springframework.cloud.gateway=INFO
