spring.application.name=config-service
server.port=${SERVER_PORT:${PORT:8888}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.ip-address=${CONSUL_DISCOVERY_IP:127.0.0.1}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.discovery.enabled=${CONSUL_ENABLED:true}

spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:${CONFIG_REPO_PATH:./config-repo}

spring.security.user.name=${CONFIG_SERVER_USERNAME:config-admin}
spring.security.user.password=${CONFIG_SERVER_PASSWORD:}

management.endpoints.web.exposure.include=health,info
