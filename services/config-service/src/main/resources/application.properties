spring.application.name=config-service
# PORT: Render (va PaaS noi chung) cap cong dong qua bien PORT; local dat SERVER_PORT.
server.port=${SERVER_PORT:${PORT:8888}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
# Dang ky dia chi ma client (5 service) goi duoc: cung may nen dung 127.0.0.1.
spring.cloud.consul.discovery.ip-address=${CONSUL_DISCOVERY_IP:127.0.0.1}
spring.cloud.consul.discovery.prefer-ip-address=true
# Render khong co Consul: dat CONSUL_ENABLED=false -> tat ca consul discovery lan
# health indicator 'consul'/'discoveryComposite', neu khong /actuator/health se DOWN
# va Render coi deploy la loi. Local de nguyen true.
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.discovery.enabled=${CONSUL_ENABLED:true}

# Native backend: config nam trong config-repo/ cua module nay. Them file
# <ten-service>.properties la service do doc duoc ngay, khong can restart
# config-service (native backend doc lai file moi request).
# Chay trong thu muc module (dev-up.ps1 lam viec nay) thi 'file:./config-repo' tro dung;
# o noi khac (vd Render) thi dat CONFIG_REPO_PATH la duong dan tuyet doi.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:${CONFIG_REPO_PATH:./config-repo}

# Secret (DB password, JWT_SECRET, SMTP password) KHONG nam trong config-repo vi
# file do duoc commit vao git. Chung van chi song o bien moi truong cua tung
# service; config-repo giu cac gia tri tune duoc va khong bi mat.
#
# Basic auth bat buoc: response cua config-server chua cau hinh moi truong.
# Client dat spring.cloud.config.username/password tuong ung.
spring.security.user.name=${CONFIG_SERVER_USERNAME}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

management.endpoints.web.exposure.include=health,info
