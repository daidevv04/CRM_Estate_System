spring.application.name=config-service
server.port=${SERVER_PORT:${PORT:8888}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true
# Tat Consul khi chay tren PaaS khong co Consul (Render): CONSUL_ENABLED=false.
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.consul.discovery.enabled=${CONSUL_ENABLED:true}
management.health.consul.enabled=${CONSUL_ENABLED:true}

# Native backend: config nam trong config-repo/, duoc COPY vao image tai
# /config-repo. Them file <ten-service>.properties la service do doc duoc ngay,
# khong can restart config-service (native backend doc lai file moi request).
# Duong dan thu hai 'file:./config-repo' de chay bang IDE tu thu muc module.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:/config-repo,file:./config-repo

# Secret (DB password, JWT_SECRET, SMTP password) KHONG nam trong config-repo vi
# file do duoc commit vao git. Chung van chi song o bien moi truong cua tung
# service; config-repo giu cac gia tri tune duoc va khong bi mat.
#
# Basic auth bat buoc: response cua config-server chua cau hinh moi truong.
# Client dat spring.cloud.config.username/password tuong ung.
spring.security.user.name=${CONFIG_SERVER_USERNAME}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

management.endpoints.web.exposure.include=health,info
