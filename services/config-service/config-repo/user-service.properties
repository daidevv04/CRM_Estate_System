# user-service: cac gia tri tinh chinh duoc, khong phai secret.
# Secret (JWT_SECRET, DUMMY_BCRYPT_HASH, mat khau DB) va thoi han token van chi
# nam o application.properties/.env cua service (chung khong co default trong code,
# va thuong phai khac nhau theo moi truong).
#
# KHONG khai lai cac key duoi day trong application.properties cua user-service:
# dong o file do se de len config-server (file import luon xep duoi file dang import).
app.auth.otp-ttl=5m
app.auth.otp-issuer=EstateCRM
app.auth.max-login-attempts=5
# Nguong rieng cho IP: nhieu nhan vien co the di chung mot NAT nen cao hon nguong tai khoan.
app.auth.max-login-attempts-ip=50
