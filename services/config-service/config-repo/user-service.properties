# user-service: thoi gian song cua token/OTP va nguong dang nhap.
# Secret (JWT_SECRET, DUMMY_BCRYPT_HASH, mat khau DB) van chi nam o .env, khong
# dat o day vi config-repo duoc commit vao git.
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d
app.auth.otp-ttl=5m
app.auth.otp-issuer=EstateCRM
app.auth.max-login-attempts=5
app.auth.max-login-attempts-ip=50
