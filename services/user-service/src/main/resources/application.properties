spring.application.name=user-service
# PORT: Render (va PaaS noi chung) cap cong dong qua bien PORT; local dat SERVER_PORT.
server.port=${SERVER_PORT:${PORT:8091}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
# Dang ky dia chi ma gateway goi duoc. Tat ca service chay tren cung mot may nen
# dung 127.0.0.1; dat CONSUL_DISCOVERY_IP khi moi service nam o host khac.
spring.cloud.consul.discovery.ip-address=${CONSUL_DISCOVERY_IP:127.0.0.1}
spring.cloud.consul.discovery.prefer-ip-address=true
# Render khong co Consul: dat CONSUL_ENABLED=false -> tat ca consul discovery lan
# health indicator 'consul'/'discoveryComposite', neu khong /actuator/health se DOWN
# va Render coi deploy la loi. Local de nguyen true.
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.discovery.enabled=${CONSUL_ENABLED:true}

# Doc config tap trung tu config-service. 'optional:' nghia la config-service khong chay
# thi service van start bang gia tri trong file nay (khong fail-fast).
# CONFIG_SERVER_URL / CONFIG_SERVER_USERNAME / CONFIG_SERVER_PASSWORD lay tu .env.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# Tomcat RemoteIpValve: doc X-Forwarded-For nhung chi tin proxy noi bo (gateway
# chay cung mang). Khong bat o gateway: gateway phai giu nguyen X-Forwarded-For
# cua khach de khong tin header do.
server.forward-headers-strategy=native

spring.datasource.url=jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT:5432}/${USER_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${USER_DB_USERNAME}
spring.datasource.password=${USER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Schema duoc provision bang tay tren Supabase SQL Editor; db/migration/V1__init.sql
# chi la ban ghi lai schema dang chay, khong duoc Flyway tu ap dung.
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
app.auth.dummy-bcrypt-hash=${DUMMY_BCRYPT_HASH}

# Cac gia tri tinh chinh (otp-ttl, otp-issuer, max-login-attempts, max-login-attempts-ip)
# da chuyen sang config-repo/user-service.properties: KHONG khai lai o day, vi dong
# trong file nay se de len config-server va lam config-server mat tac dung.
# Code van giu default trung voi config-repo nen config-service chet thi service
# van start binh thuong. Override nhanh theo moi truong bang bien dang
# APP_AUTH_OTP_TTL, APP_AUTH_MAX_LOGIN_ATTEMPTS (relaxed binding).

# mail-service gui mail that (Resend API); user-service chi goi REST. Default
# localhost:8084; dat MAIL_SERVICE_URL khi mail-service nam o host khac.
app.mail.base-url=${MAIL_SERVICE_URL:http://localhost:8084}
