spring.application.name=user-service
server.port=${SERVER_PORT:${PORT:8091}}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.ip-address=${CONSUL_DISCOVERY_IP:127.0.0.1}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.enabled=${CONSUL_ENABLED:true}
spring.cloud.discovery.enabled=${CONSUL_ENABLED:true}

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

server.forward-headers-strategy=native

spring.datasource.url=jdbc:postgresql://${USER_DB_HOST:aws-0-ap-northeast-2.pooler.supabase.com}:${USER_DB_PORT:5432}/${USER_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${USER_DB_USERNAME:postgres.yhvaktvfftfsvgmpcayj}
spring.datasource.password=${USER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
app.auth.dummy-bcrypt-hash=${DUMMY_BCRYPT_HASH:}

app.mail.base-url=${MAIL_SERVICE_URL:http://localhost:8084}
app.crm.base-url=${CRM_SERVICE_URL:http://localhost:8083}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
