spring.application.name=user-service
server.port=${SERVER_PORT:8081}

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true

# Tomcat RemoteIpValve: doc X-Forwarded-For nhung chi tin proxy noi bo (docker
# network). Khong bat o gateway: gateway phai giu nguyen X-Forwarded-For cua
# khach de khong tin header do.
server.forward-headers-strategy=native

spring.datasource.url=jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT:5432}/${USER_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${USER_DB_USERNAME}
spring.datasource.password=${USER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Schema duoc provision bang tay tren Supabase SQL Editor; db/migration/V1__init.sql
# chi la ban ghi lai schema dang chay, khong duoc Flyway tu ap dung.
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
app.auth.dummy-bcrypt-hash=${DUMMY_BCRYPT_HASH}
app.auth.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
# Nguong rieng cho IP: nhieu nhan vien co the di chung mot NAT nen cao hon nguong tai khoan.
app.auth.max-login-attempts-ip=${MAX_LOGIN_ATTEMPTS_IP:50}
