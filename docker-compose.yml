services:
  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 12

  api-gateway-service:
    build: ./services/api-gateway-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    environment:
      SERVER_PORT: ${GATEWAY_PORT:-8080}
      # Gioi han heap cho tung JVM: 6 service tren mot may nho (VPS 2GB) van chay
      # duoc. Doi gia tri nay trong .env khi co nhieu RAM hon.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GATEWAY_AUTH_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      GATEWAY_AUTH_RATE_LIMIT_WINDOW: ${GATEWAY_AUTH_RATE_LIMIT_WINDOW:-1m}
      GATEWAY_MAX_REQUEST_BODY: ${GATEWAY_MAX_REQUEST_BODY:-1MB}
      GATEWAY_MAX_INITIAL_LINE_LENGTH: ${GATEWAY_MAX_INITIAL_LINE_LENGTH:-4KB}
      GATEWAY_MAX_HEADER_SIZE: ${GATEWAY_MAX_HEADER_SIZE:-16KB}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  # Config tap trung cho 5 service. Khong publish port: chi trong docker network,
  # va van bat basic auth vi response chua cau hinh moi truong.
  # Service muon lay config: them dependency spring-cloud-starter-config roi dat
  #   spring.config.import=optional:configserver:http://config-service:8888
  #   spring.cloud.config.username=${CONFIG_SERVER_USERNAME}
  #   spring.cloud.config.password=${CONFIG_SERVER_PASSWORD}
  # va bo cac dong trung lap trong application.properties cua service do.
  config-service:
    build: ./services/config-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${CONFIG_SERVICE_PORT:-8888}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME not set}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD not set}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$CONFIG_SERVER_USERNAME:$$CONFIG_SERVER_PASSWORD\" http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${USER_SERVICE_PORT:-8081}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: ${USER_DB_PORT:-5432}
      USER_DB_NAME: ${USER_DB_NAME:-postgres}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      DUMMY_BCRYPT_HASH: ${DUMMY_BCRYPT_HASH:?DUMMY_BCRYPT_HASH not set}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      MAX_LOGIN_ATTEMPTS_IP: ${MAX_LOGIN_ATTEMPTS_IP:-50}
      # OTP gui qua mail-service (khong publish port ra host).
      MAIL_SERVICE_URL: ${MAIL_SERVICE_URL:-http://mail-service:8084}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  customer-service:
    build: ./services/customer-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${CUSTOMER_SERVICE_PORT:-8082}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      CUSTOMER_DB_HOST: ${CUSTOMER_DB_HOST}
      CUSTOMER_DB_PORT: ${CUSTOMER_DB_PORT:-5432}
      CUSTOMER_DB_NAME: ${CUSTOMER_DB_NAME:-postgres}
      CUSTOMER_DB_USERNAME: ${CUSTOMER_DB_USERNAME}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      # Email care gui that qua mail-service.
      MAIL_SERVICE_URL: ${MAIL_SERVICE_URL:-http://mail-service:8084}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  crm-service:
    build: ./services/crm-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${CRM_SERVICE_PORT:-8083}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      CRM_DB_HOST: ${CRM_DB_HOST}
      CRM_DB_PORT: ${CRM_DB_PORT:-5432}
      CRM_DB_NAME: ${CRM_DB_NAME:-postgres}
      CRM_DB_USERNAME: ${CRM_DB_USERNAME}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  # Khong publish port: chi user-service goi trong docker network, va phai co
  # internal token (scope=internal) moi dung duoc.
  mail-service:
    build: ./services/mail-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${MAIL_SERVICE_PORT:-8084}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST not set}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM not set}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy
