services:
  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 12

  api-gateway-service:
    build: ./services/api-gateway-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GATEWAY_AUTH_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      GATEWAY_AUTH_RATE_LIMIT_WINDOW: ${GATEWAY_AUTH_RATE_LIMIT_WINDOW:-1m}
      GATEWAY_MAX_REQUEST_BODY: ${GATEWAY_MAX_REQUEST_BODY:-1MB}
      GATEWAY_MAX_INITIAL_LINE_LENGTH: ${GATEWAY_MAX_INITIAL_LINE_LENGTH:-4KB}
      GATEWAY_MAX_HEADER_SIZE: ${GATEWAY_MAX_HEADER_SIZE:-16KB}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: ${USER_DB_PORT:-5432}
      USER_DB_NAME: ${USER_DB_NAME:-postgres}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      DUMMY_BCRYPT_HASH: ${DUMMY_BCRYPT_HASH:?DUMMY_BCRYPT_HASH not set}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      MAX_LOGIN_ATTEMPTS_IP: ${MAX_LOGIN_ATTEMPTS_IP:-50}
      # OTP gui qua mail-service (khong publish port ra host).
      MAIL_SERVICE_URL: http://mail-service:8084
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  customer-service:
    build: ./services/customer-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      CUSTOMER_DB_HOST: ${CUSTOMER_DB_HOST}
      CUSTOMER_DB_PORT: ${CUSTOMER_DB_PORT:-5432}
      CUSTOMER_DB_NAME: ${CUSTOMER_DB_NAME:-postgres}
      CUSTOMER_DB_USERNAME: ${CUSTOMER_DB_USERNAME}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      # Email care gui that qua mail-service.
      MAIL_SERVICE_URL: http://mail-service:8084
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  crm-service:
    build: ./services/crm-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      CRM_DB_HOST: ${CRM_DB_HOST}
      CRM_DB_PORT: ${CRM_DB_PORT:-5432}
      CRM_DB_NAME: ${CRM_DB_NAME:-postgres}
      CRM_DB_USERNAME: ${CRM_DB_USERNAME}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  # Khong publish port: chi user-service goi trong docker network, va phai co
  # internal token (scope=internal) moi dung duoc.
  mail-service:
    build: ./services/mail-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST not set}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM not set}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy
