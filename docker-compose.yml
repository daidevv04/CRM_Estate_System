services:
  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 12

  api-gateway-service:
    build: ./services/api-gateway-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    env_file:
      - .env
    # Khong publish ra host: chi gateway duoc goi vao. Xem review_full_system_v2.md
    # muc N1 - mo port ra host cho phep gia mao X-Forwarded-For va brute-force
    # khong gioi han. Can goi thang thi dung: docker compose exec user-service ...
    environment:
      SERVER_PORT: 8081
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: ${USER_DB_PORT:-5432}
      USER_DB_NAME: ${USER_DB_NAME:-postgres}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      DUMMY_BCRYPT_HASH: ${DUMMY_BCRYPT_HASH:?DUMMY_BCRYPT_HASH not set}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      MAX_LOGIN_ATTEMPTS_IP: ${MAX_LOGIN_ATTEMPTS_IP:-50}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy

  customer-service:
    build: ./services/customer-service
    restart: unless-stopped
    env_file:
      - .env
    # Khong publish ra host, cung ly do nhu user-service. Trong cung network
    # container van goi duoc nhau nen khong can expose.
    environment:
      SERVER_PORT: 8082
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      CUSTOMER_DB_HOST: ${CUSTOMER_DB_HOST}
      CUSTOMER_DB_PORT: ${CUSTOMER_DB_PORT:-5432}
      CUSTOMER_DB_NAME: ${CUSTOMER_DB_NAME:-postgres}
      CUSTOMER_DB_USERNAME: ${CUSTOMER_DB_USERNAME}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      consul:
        condition: service_healthy
