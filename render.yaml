# Render Blueprint cho CRM bat dong san.
#
# QUAN TRONG: Render KHONG chay docker-compose. Moi service trong docker-compose.yml
# tro thanh 1 Render service rieng, tro vao Dockerfile cua no. Consul khong co tren
# Render nen tat bang CONSUL_ENABLED=false va gateway goi service bang URL tinh.
#
# Cach dung: push repo len GitHub -> Render Dashboard -> New -> Blueprint -> chon repo.
# Render se doc file nay, hoi cac gia tri sync:false (secret) thi dien vao.
#
# LUU Y VE FREE PLAN (da kiem tra doc Render):
#   - Chi web service / Postgres / Key Value moi co ban free. pserv (private) phai tra phi.
#   - Free web service ngu sau 15 phut, thuc day mat ~35-40s (do thuc te cua stack nay).
#   - Free web service KHONG nhan duoc traffic private network -> gateway phai goi
#     cac service qua URL public (https://<ten>.onrender.com), khong dung http://<ten>:<port>.
#   - Free web service bi chan outbound port 25/465/587 -> mail-service KHONG gui duoc
#     SMTP, tuc luong OTP se loi. Muon gui mail that thi mail-service phai len plan starter
#     (hoac doi sang API gui mail qua HTTPS).
#
# Doi sang production that: doi "plan: free" thanh "plan: starter" cho tung service,
# va doi 5 service backend thanh type: pserv (private, khong lo ra internet) nhu huong
# dan trong comment cua tung service.

envVarGroups:
  # Gom secret vao 1 nhom de dien 1 lan. sync: false => Render hoi gia tri khi tao
  # Blueprint va khong luu gia tri trong git.
  - name: crm-secrets
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DUMMY_BCRYPT_HASH
        sync: false
      - key: USER_DB_HOST
        sync: false
      - key: USER_DB_USERNAME
        sync: false
      - key: USER_DB_PASSWORD
        sync: false
      - key: CUSTOMER_DB_HOST
        sync: false
      - key: CUSTOMER_DB_USERNAME
        sync: false
      - key: CUSTOMER_DB_PASSWORD
        sync: false
      - key: CRM_DB_HOST
        sync: false
      - key: CRM_DB_USERNAME
        sync: false
      - key: CRM_DB_PASSWORD
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONFIG_SERVER_PASSWORD
        sync: false
      # Gia tri khong phai secret, dat thang o day cho tien.
      - key: USER_DB_PORT
        value: 5432
      - key: USER_DB_NAME
        value: postgres
      - key: CUSTOMER_DB_PORT
        value: 5432
      - key: CUSTOMER_DB_NAME
        value: postgres
      - key: CRM_DB_PORT
        value: 5432
      - key: CRM_DB_NAME
        value: postgres
      - key: MAIL_PORT
        value: 587
      - key: MAIL_SMTP_AUTH
        value: true
      - key: MAIL_STARTTLS
        value: true
      - key: CONFIG_SERVER_USERNAME
        value: config-admin
      # Free instance chi 512MB RAM/service; gioi han heap de khong bi OOM kill.
      # May >=2GB RAM thi co the tang len -Xmx512m.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k

services:
  # ---------------------------------------------------------------- gateway (public)
  - type: web
    name: crm-gateway
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./services/api-gateway-service/Dockerfile
    dockerContext: ./services/api-gateway-service
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - fromGroup: crm-secrets
      - key: CONSUL_ENABLED
        value: false
      # URL tinh thay cho lb://<ten>. Render dat ten service = <name>.onrender.com,
      # nen URL dung duoc ngay. Neu ten bi trung va Render them hau to thi sua 3 dong nay.
      - key: USER_SERVICE_URI
        value: https://crm-user-service.onrender.com
      - key: CUSTOMER_SERVICE_URI
        value: https://crm-customer-service.onrender.com
      - key: CRM_SERVICE_URI
        value: https://crm-crm-service.onrender.com
      # Origin frontend that (khong dung '*'). Sua sau khi co domain.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: GATEWAY_AUTH_RATE_LIMIT_MAX_REQUESTS
        value: 20
      - key: GATEWAY_AUTH_RATE_LIMIT_WINDOW
        value: 1m
      - key: GATEWAY_MAX_REQUEST_BODY
        value: 1MB

  # ------------------------------------------------------------- user-service
  # Production (tra phi, khong lo ra internet): doi "type: web" -> "type: pserv",
  # doi plan sang starter, bo healthCheckPath, roi o gateway dat
  # USER_SERVICE_URI=http://crm-user-service:10000  (PORT co dinh qua env PORT=10000)
  - type: web
    name: crm-user-service
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./services/user-service/Dockerfile
    dockerContext: ./services/user-service
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - fromGroup: crm-secrets
      - key: CONSUL_ENABLED
        value: false
      # user-service goi mail-service de gui OTP. Tren free plan SMTP bi chan (xem dau file).
      - key: MAIL_SERVICE_URL
        value: https://crm-mail-service.onrender.com
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_REFRESH_TOKEN_TTL
        value: 30d
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: MAX_LOGIN_ATTEMPTS_IP
        value: 50
      - key: OTP_TTL
        value: 5m
      - key: OTP_ISSUER
        value: EstateCRM

  # --------------------------------------------------------- customer-service
  - type: web
    name: crm-customer-service
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./services/customer-service/Dockerfile
    dockerContext: ./services/customer-service
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - fromGroup: crm-secrets
      - key: CONSUL_ENABLED
        value: false
      - key: MAIL_SERVICE_URL
        value: https://crm-mail-service.onrender.com

  # ---------------------------------------------------------------- crm-service
  - type: web
    name: crm-crm-service
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./services/crm-service/Dockerfile
    dockerContext: ./services/crm-service
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - fromGroup: crm-secrets
      - key: CONSUL_ENABLED
        value: false

  # --------------------------------------------------------------- mail-service
  # Free plan chan outbound 25/465/587 => lop nay se bao loi gui mail.
  # Muon gui that: doi plan sang starter (SMTP mo lai), hoac doi MailClient sang API HTTPS.
  - type: web
    name: crm-mail-service
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./services/mail-service/Dockerfile
    dockerContext: ./services/mail-service
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - fromGroup: crm-secrets
      - key: CONSUL_ENABLED
        value: false

  # ------------------------------------------------------------- config-service
  # Chua noi vao service nao (cac service van doc bien moi truong). Giu lai de xem truoc,
  # neu khong can thi xoa block nay de bot 1 service.
  - type: web
    name: crm-config-service
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./services/config-service/Dockerfile
    dockerContext: ./services/config-service
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - fromGroup: crm-secrets
      - key: CONSUL_ENABLED
        value: false
